name: astral-uv
title: uv (by Astral)
base: core24
version: 0.8.11
summary: An extremely fast Python package installer and resolver, written in Rust.
description: |
  An extremely fast Python package installer and resolver, written in Rust. Designed as a drop-in replacement for common pip and pip-tools workflows.

grade: stable
confinement: classic

platforms:
  amd64:
  arm64:
  armhf:
    build-on: [amd64, arm64]  # Runs out of memory building on armhf
  ppc64el:
  riscv64:
  s390x:

parts:
  uv:
    plugin: rust
    source: https://github.com/astral-sh/uv.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - to armhf:
          - gcc-arm-linux-gnueabihf
          - libc6-dev-armhf-cross
    rust-path:
      - crates/uv
    build-snaps:
      - rustup
    build-attributes:
      - enable-patchelf
    organize:
      uv: bin/uv
      uvx: bin/uvx
      lib*.so: lib/
    build-environment:
      - to armhf:
        - CARGO_BUILD_TARGET: $(echo $CRAFT_ARCH_TRIPLET_BUILD_FOR | sed -e s/-linux/-unknown-linux/ -e s/armhf/armv7/)
      - RUSTFLAGS: -C linker=${CRAFT_ARCH_TRIPLET_BUILD_FOR}-gcc
    override-pull: |
      apt-get remove --yes cmake rustc
      rustup target add $CARGO_BUILD_TARGET
      craftctl default
  completion:
    plugin: nil
    after: [uv]
    override-build: |
      if [[ "$CRAFT_ARCH_TRIPLET_BUILD_FOR" == "$CRAFT_ARCH_TRIPLET_BUILD_ON" ]]; then
        "${CRAFT_STAGE}/bin/uv" generate-shell-completion bash > "${CRAFT_PART_INSTALL}/uv-completion.bash"
        echo 'complete -F _uv -o bashdefault -o default astral-uv.uv' >> "${CRAFT_PART_INSTALL}/uv-completion.bash"
        echo 'complete -F _uv -o bashdefault -o default uv' >> "${CRAFT_PART_INSTALL}/uv-completion.bash"
      fi
apps:
  uv:
    command: bin/uv
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
    completer: uv-completion.bash
  uvx:
    command: bin/uvx
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
