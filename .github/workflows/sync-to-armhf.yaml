name: Sync to armhf branch

on:
  push:
    branches:
      - candidate

permissions:
  issues: write
  contents: write

jobs:
  sync:
    name: 🔄 Sync candidate branch to armhf
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the source
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: candidate-armhf
    - name: Merge from candidate
      run: |
        git fetch origin
        git config --global user.name "${{ inputs.bot-name }}"
        git config --global user.email "${{ inputs.bot-email }}"

        git merge origin/candidate -m 'chore: merge candidate to armhf'
        git push
